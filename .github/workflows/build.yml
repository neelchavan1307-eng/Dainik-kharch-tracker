name: Build Dainik Kharch APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup Icon and Android
        run: |
          ICON=$(ls IMG*.jpg 2>/dev/null | head -1)
          cp pubspec.yaml /tmp/p.yaml
          cp lib/main.dart /tmp/m.dart
          rm -rf android
          flutter create --project-name dainik_kharch_tracker --org com.example --platforms android .
          cp /tmp/p.yaml pubspec.yaml
          cp /tmp/m.dart lib/main.dart
          mkdir -p assets
          cp "$ICON" assets/app_icon.png
          # FIX 1: Pubspec fix
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("pubspec.yaml")
          t=p.read_text()
          # clean old launcher
          t="\n".join([l for l in t.splitlines() if "flutter_launcher_icons: ^0.13.1" not in l])
          # remove old root config if exists
          if 'image_path:' in t:
              lines=[]
              skip=False
              for l in t.splitlines():
                  if l.strip().startswith('flutter_launcher_icons:') and not l.startswith(' '):
                      skip=True
                      continue
                  if skip:
                      if l.strip().startswith('android:') or l.strip().startswith('image_path:') or l.strip().startswith('min_sdk'):
                          continue
                      skip=False
                  lines.append(l)
              t="\n".join(lines)
          if "dev_dependencies:" in t:
              if "flutter_launcher_icons" not in t:
                  t=t.replace("dev_dependencies:", "dev_dependencies:\n  flutter_launcher_icons: ^0.13.1")
          else:
              t+="\ndev_dependencies:\n  flutter_launcher_icons: ^0.13.1\n"
          t+="\nflutter_launcher_icons:\n  android: \"launcher_icon\"\n  image_path: \"assets/app_icon.png\"\n  min_sdk_android: 21\n"
          p.write_text(t)
          PY
          # FIX 2: Add Fingerprint Permission in AndroidManifest
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n    <uses-permission android:name="android.permission.USE_BIOMETRICS" />' $MANIFEST
          cat $MANIFEST
      - name: Build with Icon + Biometric
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dainik-Kharch-Warli-Fingerprint-FIXED
          path: build/app/outputs/flutter-apk/app-release.apk
