name: Build Dainik Kharch APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Deep Clean and Rebuild Android v2
        run: |
          cp pubspec.yaml /tmp/my_pubspec.yaml
          cp lib/main.dart /tmp/my_main.dart
          rm -rf android
          flutter create --project-name dainik_kharch_tracker --org com.example --platforms android .
          cp /tmp/my_pubspec.yaml pubspec.yaml
          cp /tmp/my_main.dart lib/main.dart
          sed -i 's/<manifest/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>/' android/app/src/main/AndroidManifest.xml || true
          mkdir -p android/app/src/main/kotlin/com/example/dainik_kharch_tracker
          printf 'package com.example.dainik_kharch_tracker\nimport io.flutter.embedding.android.FlutterFragmentActivity\nclass MainActivity: FlutterFragmentActivity()\n' > android/app/src/main/kotlin/com/example/dainik_kharch_tracker/MainActivity.kt
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dainik-Kharch-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
