name: Build Dainik Kharch APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup Icon + Original Fingerprint Restore
        run: |
          cp pubspec.yaml /tmp/p.yaml
          cp lib/main.dart /tmp/m.dart
          rm -rf android
          flutter create --project-name dainik_kharch_tracker --org com.example --platforms android .
          cp /tmp/p.yaml pubspec.yaml
          cp /tmp/m.dart lib/main.dart
          mkdir -p assets
          if [ -f "assets/app_icon.png" ]; then
            echo "Icon found ✅"
          else
            echo "Icon NOT found in assets!"
            ls -R assets
          fi
          ls -lh assets/
          python3 << 'PY'
          import pathlib, os
          kt_path = "android/app/src/main/kotlin/com/example/dainik_kharch_tracker/MainActivity.kt"
          os.makedirs(os.path.dirname(kt_path), exist_ok=True)
          pathlib.Path(kt_path).write_text("package com.example.dainik_kharch_tracker\nimport io.flutter.embedding.android.FlutterFragmentActivity\nclass MainActivity: FlutterFragmentActivity()\n")
          print("Fixed MainActivity to FlutterFragmentActivity")
          PY
          # --- FIX FOR file_picker ERROR ---
          sed -i "s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g" android/app/build.gradle
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 35/g" android/app/build.gradle
          sed -i "s/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g" android/app/build.gradle
          sed -i "s/targetSdk flutter.targetSdkVersion/targetSdk 35/g" android/app/build.gradle
          echo "Fixed compileSdk to 35 ✅"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />' android/app/src/main/AndroidManifest.xml
      - name: Build
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dainik-Kharch-Warli-Pradip
          path: build/app/outputs/flutter-apk/app-release.apk
