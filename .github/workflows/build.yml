name: Build Dainik Kharch APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/dainik_kharch_tracker
          printf 'package com.example.dainik_kharch_tracker\nimport io.flutter.embedding.android.FlutterFragmentActivity\nclass MainActivity: FlutterFragmentActivity()\n' > android/app/src/main/kotlin/com/example/dainik_kharch_tracker/MainActivity.kt
      - name: Install deps
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dainik-Kharch-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
