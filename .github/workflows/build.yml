name: Build Dainik Kharch APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix Project for First Try Green
        run: |
          cp pubspec.yaml /tmp/my_pubspec.yaml
          cp lib/main.dart /tmp/my_main.dart
          flutter create --project-name dainik_kharch_tracker --platforms android --overwrite
          cp /tmp/my_pubspec.yaml pubspec.yaml
          cp /tmp/my_main.dart lib/main.dart
          mkdir -p android/app/src/main/kotlin/com/example/dainik_kharch_tracker
          echo 'package com.example.dainik_kharch_tracker
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity: FlutterFragmentActivity()' > android/app/src/main/kotlin/com/example/dainik_kharch_tracker/MainActivity.kt
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dainik-Kharch-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
