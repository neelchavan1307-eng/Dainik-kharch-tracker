name: kharchachi_nond_vahi
description: "खर्चाची नोंद वही - आपला खर्च, आपला हिशोब. Fingerprint + Pattern Lock + Graph + Premium 3D"
publish_to: 'none'
version: 2.0.0+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: any
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  local_auth: ^2.1.7
  file_picker: ^8.1.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/warli_bg.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false
